name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wujie_bridge_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wujie_bridge_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGDATABASE_URL: ${{ secrets.PGDATABASE_URL }}
      WUJIE_AUTH_SECRET: ${{ secrets.WUJIE_AUTH_SECRET }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      PAYMENT_TOKEN_SECRET: ${{ secrets.PAYMENT_TOKEN_SECRET }}
      WUJIE_ADMIN_PASSWORD: ${{ secrets.WUJIE_ADMIN_PASSWORD }}
      MANDATORY_API_AUTH: 'true'
      WUJIE_DATA_DIR: .wujie-data
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install CPU media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Prepare doctor data directory
        run: mkdir -p "$WUJIE_DATA_DIR"
      - name: Environment doctor (production)
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        run: pnpm doctor -- --production
      - name: Environment doctor (untrusted pull request)
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.actor == 'dependabot[bot]')
        run: pnpm doctor
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm ts-check
      - name: ESLint
        run: pnpm lint:build
      - name: Prepare isolated Vitest media root
        env:
          WUJIE_DATA_DIR: ${{ runner.temp }}/wujie-bridge-test-ci
        run: mkdir -p "$WUJIE_DATA_DIR"
      - name: Unit and integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          PGDATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          WUJIE_DATA_DIR: ${{ runner.temp }}/wujie-bridge-test-ci
        run: pnpm test:ci
      - name: Production dependency audit
        run: pnpm audit --prod --json --registry=https://registry.npmjs.org
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wujie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wujie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGDATABASE_URL: postgresql://postgres:postgres@localhost:5432/wujie_test
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/wujie_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run PostgreSQL concurrency and settlement tests
        run: >-
          pnpm exec vitest run
          src/__tests__/api/layered-decompose-postgres-concurrency.test.ts
          src/__tests__/lib/annotation-postgres-concurrency.test.ts
          src/__tests__/lib/psd-analysis-postgres-concurrency.test.ts
          --pool=forks --poolOptions.forks.singleFork=true

  stage-3-canvas-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        canvas-mode: [legacy, shadow, canvas-v2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wujie_stage3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wujie_stage3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGDATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_stage3
      E2E_STAGE3_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_stage3
      E2E_STAGE3_DATABASE_GUARD: stage3-ci-guard
      E2E_STAGE3_ALLOW_SEED: '1'
      E2E_STAGE3_RUN_ID: ci-${{ matrix.canvas-mode }}-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_STAGE3_ENV_OUTPUT: /tmp/wujie-stage3-environment.json
      E2E_BASE_URL: http://127.0.0.1:5000
      E2E_TEST_USERNAME: stage3-ci
      E2E_TEST_PASSWORD: Stage3-CI-${{ github.run_id }}!
      WUJIE_AUTH_SECRET: stage3-ci-auth-secret-minimum-32-bytes-${{ github.run_id }}-${{ github.run_attempt }}
      INTERNAL_API_SECRET: stage3-ci-internal-${{ github.run_id }}-${{ github.run_attempt }}
      WUJIE_ADMIN_PASSWORD: Stage3-Admin-${{ github.run_id }}!
      WUJIE_DATA_DIR: /tmp/wujie-stage3-data
      WUJIE_CANVAS_KERNEL_MODE: ${{ matrix.canvas-mode }}
      E2E_STAGE3_EXPECTED_CANVAS_MODE: ${{ matrix.canvas-mode }}
      WUJIE_ASSET_GRAPH_MODE: legacy
      WUJIE_TASK_CORE_MODE: legacy
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Prepare isolated database
        shell: bash
        run: |
          pnpm migrate
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.PGDATABASE_URL });
          await client.connect();
          await client.query('CREATE TABLE IF NOT EXISTS wujie_stage3_e2e_guard (guard_token text PRIMARY KEY)');
          await client.query('INSERT INTO wujie_stage3_e2e_guard(guard_token) VALUES ($1) ON CONFLICT DO NOTHING', [process.env.E2E_STAGE3_DATABASE_GUARD]);
          await client.end();
          NODE
      - name: Build production application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
      - name: Start production application
        shell: bash
        run: |
          pnpm start > /tmp/wujie-stage3-server.log 2>&1 &
          echo $! > /tmp/wujie-stage3-server.pid
          for attempt in {1..90}; do
            if curl --fail --silent "$E2E_BASE_URL/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wujie-stage3-server.log
          exit 1
      - name: Seed controlled Canvas fixtures
        shell: bash
        run: |
          pnpm seed:e2e:stage-3
          echo "E2E_TEST_USERNAME=$(jq -r .E2E_TEST_USERNAME "$E2E_STAGE3_ENV_OUTPUT")" >> "$GITHUB_ENV"
          echo "E2E_STAGE3_PROJECT_IDS=$(jq -r .E2E_STAGE3_PROJECT_IDS "$E2E_STAGE3_ENV_OUTPUT")" >> "$GITHUB_ENV"
      - name: Run five-browser Canvas matrix
        run: >-
          pnpm test:e2e:stage-3
          --project=chromium --project=chromium-1080p
          --project=firefox --project=webkit --project=mobile-chromium
      - name: Upload Stage 3 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-3-canvas-evidence-${{ matrix.canvas-mode }}-${{ github.sha }}
          path: |
            test-results/stage-3-baseline/
            /tmp/wujie-stage3-server.log
          if-no-files-found: error

  stage-4-workspace-interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wujie_stage4_ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGDATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_stage4_ci_${{ github.run_id }}_${{ github.run_attempt }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_stage4_ci_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_stage4_ci_${{ github.run_id }}_${{ github.run_attempt }}
      E2E_STAGE4_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_stage4_ci_${{ github.run_id }}_${{ github.run_attempt }}
      E2E_STAGE4_RUN_ID: ci_${{ github.run_id }}_${{ github.run_attempt }}
      E2E_BASE_URL: http://127.0.0.1:5000
      WUJIE_AUTH_SECRET: stage4-ci-auth-secret-minimum-32-bytes-${{ github.run_id }}-${{ github.run_attempt }}
      INTERNAL_API_SECRET: stage4-ci-internal-${{ github.run_id }}-${{ github.run_attempt }}
      WUJIE_ADMIN_PASSWORD: Stage4-Admin-${{ github.run_id }}!
      WUJIE_DATA_DIR: /tmp/wujie-stage4-data
      WUJIE_AGENT_RUNTIME_MODE: agent-v2
      WUJIE_WORKFLOW_RENDERER_MODE: react-flow-v2
      E2E_STAGE4_EXPECTED_AGENT_MODE: agent-v2
      E2E_STAGE4_EXPECTED_WORKFLOW_RENDERER_MODE: react-flow-v2
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Generate Stage 4 inventory
        run: pnpm test:inventory:stage-4
      - name: Run Stage 4 PostgreSQL event and accounting tests
        run: >-
          pnpm exec vitest run
          tests/integration/stage-4-agent-events-postgres.test.ts
          tests/integration/stage-4-agent-accounting-postgres.test.ts
          --pool=forks --poolOptions.forks.singleFork=true
      - name: Prepare Stage 4 application database
        run: pnpm migrate
      - name: Build production application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
      - name: Start production application
        shell: bash
        run: |
          pnpm start > /tmp/wujie-stage4-server.log 2>&1 &
          echo $! > /tmp/wujie-stage4-server.pid
          for attempt in {1..90}; do
            if curl --fail --silent "$E2E_BASE_URL/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wujie-stage4-server.log
          exit 1
      - name: Run five-browser Stage 4 workspace matrix
        run: >-
          pnpm test:e2e:stage-4
          --project=chromium --project=chromium-1080p
          --project=firefox --project=webkit --project=mobile-chromium
      - name: Upload Stage 4 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-4-workspace-evidence-${{ github.sha }}
          path: |
            test-results/stage-4-baseline/
            playwright-report/
            .playwright-output/
            /tmp/wujie-stage4-server.log
          if-no-files-found: error

  real-p0-browser:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_GENERATION_MODEL: ${{ secrets.E2E_GENERATION_MODEL }}
      E2E_ENABLE_PAID_GENERATION: ${{ secrets.E2E_ENABLE_PAID_GENERATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate real P0 E2E configuration
        shell: bash
        run: |
          missing=0
          for name in E2E_BASE_URL E2E_TEST_USERNAME E2E_TEST_PASSWORD E2E_GENERATION_MODEL E2E_ENABLE_PAID_GENERATION; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing E2E configuration::$name is required"
              missing=1
            fi
          done
          if [ "$E2E_ENABLE_PAID_GENERATION" != "1" ] && [ "$E2E_ENABLE_PAID_GENERATION" != "true" ]; then
            echo "::error title=Paid E2E disabled::E2E_ENABLE_PAID_GENERATION must be 1 or true"
            missing=1
          fi
          exit "$missing"
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run real HTTP API, security, and chaos tests
        run: pnpm test:http-api
      - name: Run real P0 Chromium journeys
        run: pnpm exec playwright test tests/e2e/p0-core.spec.ts --project=chromium
      # Pear paid acceptance was canceled; retain the existing non-billable PSD regressions.
      - name: Run non-billable cross-browser layer regression
        env:
          LAYER_E2E_SKIP_PROVIDER_CALL: '1'
        run: pnpm exec playwright test tests/e2e/layer-editing.spec.ts --project=chromium --project=firefox --project=webkit
      - name: Collect immutable browser evidence
        if: always()
        run: pnpm test:artifacts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-browser-evidence
          path: |
            playwright-report/
            test-results/
            .playwright-output/
          if-no-files-found: warn
