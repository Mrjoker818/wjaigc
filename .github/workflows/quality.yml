name: DG phase diagnosis only (not a release gate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-dg-two-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WUJIE_DATA_DIR: /tmp/wujie-dg-phase-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Diagnose exactly the two failed DG cases
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run src/__tests__/components/canvas-model-viewer-dg-native.test.tsx \
            --testNamePattern '^DG (gold 320x640|mono 640x320) controls actual parent owned glTF rendering and mobile controls$' \
            2>&1 | tee dg-two-case-diagnostic.log
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-phase-diagnostic-${{ github.sha }}
          path: |
            dg-two-case-diagnostic.log
            output/playwright/canvas-model-viewer-dg-native-20261020/
          if-no-files-found: error

# This manual branch intentionally has no paid/provider or release jobs.
# Its results cannot replace either original release workflow.
