name: Quality gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --json --registry=https://registry.npmjs.org
      - run: pnpm doctor
      - run: pnpm ts-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:api
      - run: pnpm test:regression
      - run: pnpm build

  real-p0-e2e:
    needs: quality
    runs-on: ubuntu-latest
    environment: real-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate real P0 E2E configuration
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_GENERATION_MODEL: ${{ secrets.E2E_GENERATION_MODEL }}
          E2E_ENABLE_PAID_GENERATION: ${{ secrets.E2E_ENABLE_PAID_GENERATION }}
        run: |
          missing=()
          for name in E2E_BASE_URL E2E_TEST_USERNAME E2E_TEST_PASSWORD E2E_GENERATION_MODEL E2E_ENABLE_PAID_GENERATION; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing real-e2e environment secrets: ${missing[*]}"
            exit 1
          fi
          if [[ "$E2E_ENABLE_PAID_GENERATION" != "true" ]]; then
            echo "::error::E2E_ENABLE_PAID_GENERATION must be true for the required real generation flow"
            exit 1
          fi
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e:p0
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_GENERATION_MODEL: ${{ secrets.E2E_GENERATION_MODEL }}
          E2E_ENABLE_PAID_GENERATION: ${{ secrets.E2E_ENABLE_PAID_GENERATION }}
      - run: pnpm test:artifacts
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-e2e-evidence
          path: |
            playwright-report/
            test-results/
