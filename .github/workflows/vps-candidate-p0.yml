name: VPS candidate P0
on:
  workflow_dispatch:
    inputs:
      run_paid:
        description: Run the separately authorized real P0 generation once
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vps-candidate-p0
  cancel-in-progress: false
jobs:
  real-p0:
    if: github.ref == 'refs/heads/acceptance/vps-p0-79a92dc3'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: real-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 4
      - name: Confirm candidate
        shell: bash
        run: |
          set -eu

          base=79a92dc39ce016af0daeadfc430847091e15b0e7
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base^{tree}")" = 316072ecfe2f9febb5485c93ce036436f38a3010
          test "$(git diff --name-only "$base"..HEAD)" = '.github/workflows/vps-candidate-p0.yml'
          git checkout --detach "$base"
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'workflow_dispatch' && inputs.run_paid
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Connect to the isolated VPS
        shell: bash
        env:
          VPS_TEST_ADDRESS: ${{ secrets.VPS_TEST_ADDRESS }}
          VPS_TEST_HOST_KEY: ${{ secrets.VPS_TEST_HOST_KEY }}
          VPS_TEST_SSH_KEY: ${{ secrets.VPS_TEST_SSH_KEY }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          set -eu
          umask 077
          test "$E2E_BASE_URL" = http://127.0.0.1:15179
          test -n "$VPS_TEST_ADDRESS"
          test -n "$VPS_TEST_HOST_KEY"
          test -n "$VPS_TEST_SSH_KEY"
          printf '%s\n' "$VPS_TEST_HOST_KEY" >"$RUNNER_TEMP/vps-known-hosts"
          printf '%s\n' "$VPS_TEST_SSH_KEY" >"$RUNNER_TEMP/vps-test-key"
          ssh -fNT -M -S "$RUNNER_TEMP/p0-ssh.sock" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=12 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -p 45466 -i "$RUNNER_TEMP/vps-test-key" -L 127.0.0.1:15179:127.0.0.1:15179 "wujieci79@$VPS_TEST_ADDRESS"
          rm -f -- "$RUNNER_TEMP/vps-test-key"
          curl --fail --silent --show-error --max-time 10 "$E2E_BASE_URL" -o "$RUNNER_TEMP/wujie-p0-index.html"
      - name: Verify the P0 account, build and model prerequisites
        shell: bash
        env:
          P0_RUN_PAID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid }}

          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_GENERATION_MODEL: ${{ secrets.E2E_GENERATION_MODEL }}
          E2E_ENABLE_PAID_GENERATION: ${{ secrets.E2E_ENABLE_PAID_GENERATION }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = process.env.E2E_BASE_URL;
          const login = await fetch(url + '/api/auth/login', {
            method: 'POST',
            headers: { origin: url, 'content-type': 'application/json' },
            body: JSON.stringify({ name: process.env.E2E_TEST_USERNAME, password: process.env.E2E_TEST_PASSWORD, productType: 'canvas' }),
            signal: AbortSignal.timeout(10000),
          });
          assert.equal(login.status, 200, 'dedicated test account login');
          const cookie = login.headers.get('set-cookie')?.split(';')[0];
          assert(cookie, 'dedicated session cookie');
          const response = await fetch(url + '/api/models?type=image', { headers: { cookie }, signal: AbortSignal.timeout(10000) });
          assert.equal(response.status, 200, 'provider catalog');
          const body = await response.json();
          assert.equal(body.success, true, 'authorized catalog request');
          const artifact = await fetch(url + '/_next/static/316072ecfe2f9febb5485c93ce036436f38a3010/_buildManifest.js', { signal: AbortSignal.timeout(10000) });
          assert.equal(artifact.status, 200, 'deployed candidate build manifest');
          assert.match(await artifact.text(), /__BUILD_MANIFEST/);
          const model = process.env.E2E_GENERATION_MODEL;
          const approved = process.env.E2E_ENABLE_PAID_GENERATION === 'true' && process.env.P0_RUN_PAID === 'true';
          if (!model || !approved) {
            console.log('Dedicated login and catalog reachable. Real paid model verification is pending.');
          } else {
            const [providerId, modelId] = model.split('::');
            assert(providerId && modelId, 'the configured model must include its provider identity');
            const matches = (body.models ?? []).filter(model => model.providerId === providerId && model.id === modelId);
            assert.equal(matches.length, 1, 'the authorized exact image model must be present');
          }
          NODE
      - name: Install frozen dependencies and Chromium
        if: github.event_name == 'workflow_dispatch' && inputs.run_paid
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify the real P0 journey
        if: github.event_name == 'workflow_dispatch' && inputs.run_paid
        shell: bash
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_GENERATION_MODEL: ${{ secrets.E2E_GENERATION_MODEL }}
          E2E_ENABLE_PAID_GENERATION: ${{ secrets.E2E_ENABLE_PAID_GENERATION }}
        run: |
          if [ -z "$E2E_GENERATION_MODEL" ] || [ "$E2E_ENABLE_PAID_GENERATION" != true ]; then
            echo '::error title=Real P0 pending::The exact real image model and paid-run authorization must be configured.'
            exit 2
          fi
          umask 077
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/p0-private-report.json"
          export PLAYWRIGHT_WORKERS=1
          r=0
          pnpm exec playwright test tests/e2e/p0-core.spec.ts \
            --project=chromium --retries=0 --reporter=json --trace=off \
            --output="$RUNNER_TEMP/p0-private-capture" >"$RUNNER_TEMP/p0-private-run.log" 2>&1 || r=$?
          mkdir -p "$RUNNER_TEMP/p0-public"
          export P0_PLAYWRIGHT_EXIT="$r"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const n = value => Number.isSafeInteger(value) && value >= 0 ? value : undefined;
          let run;
          try { run = JSON.parse(await readFile(process.env.PLAYWRIGHT_JSON_OUTPUT_FILE, 'utf8')); } catch {}
          const stats = run?.stats;
          const exit = Number(process.env.P0_PLAYWRIGHT_EXIT);
          const counts = { passed: n(stats?.expected), failed: n(stats?.unexpected), skipped: n(stats?.skipped), flaky: n(stats?.flaky) };
          const cleanLines = [];
          function visit(suite) {
            for (const item of suite?.specs ?? []) for (const test of item.tests ?? []) for (const result of test.results ?? []) {
              const error = result.error;
              if (result.status === 'passed' || !error?.location) continue;
              const location = error.location;
              const match = String(location.file || '').replaceAll('\\','/').match(/(?:^|\/)(p0-core\.spec\.ts|evidence\.ts)$/u);
              if (match && n(location.line)) cleanLines.push({ file: match[1], line: location.line });
            }
            for (const child of suite?.suites ?? []) visit(child);
          }
          for (const suite of run?.suites ?? []) visit(suite);
          const pass = exit === 0 && counts.passed === 1 && counts.failed === 0 && counts.skipped === 0 && counts.flaky === 0;
          const summary = { candidate: '79a92dc39ce016af0daeadfc430847091e15b0e7', browser: 'chromium', exit, counts, failureLocations: cleanLines, result: pass ? 'pass' : 'fail' };
          const data = JSON.stringify(summary, null, 2);
          await writeFile(join(process.env.RUNNER_TEMP, 'p0-public', 'summary.json'), data + '\n');
          console.log(data);
          if (!pass) process.exitCode = 1;
          NODE
      - name: Upload redacted P0 result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_paid
        uses: actions/upload-artifact@v4
        with:
          name: candidate-p0-browser
          path: ${{ runner.temp }}/p0-public/summary.json
          if-no-files-found: warn
      - name: Close the VPS connection
        if: always()
        shell: bash
        env:
          VPS_TEST_ADDRESS: ${{ secrets.VPS_TEST_ADDRESS }}
        run: |
          if [ -S "$RUNNER_TEMP/p0-ssh.sock" ]; then
            ssh -S "$RUNNER_TEMP/p0-ssh.sock" -O exit -p 45466 "wujieci79@$VPS_TEST_ADDRESS" || true
          fi
          rm -f -- "$RUNNER_TEMP/vps-test-key" "$RUNNER_TEMP/vps-known-hosts" "$RUNNER_TEMP/wujie-p0-index.html"
