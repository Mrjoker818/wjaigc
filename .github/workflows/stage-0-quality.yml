name: Stage 0 and Stage 1 Quality Gate

on:
  push:
    branches:
      - main
      - stable
      - "codex/**"
  pull_request:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact deployed URL used for real browser evidence
        required: true
        type: string
      deployment_commit:
        description: Exact Git commit running at deployment_url
        required: true
        type: string
      generation_model:
        description: Exact providerId::modelId authorized for paid verification
        required: true
        type: string

permissions:
  contents: read

jobs:
  stable-integrity:
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    steps:
      - name: Reject changes to the immutable stable baseline
        shell: bash
        run: |
          expected="52f7c601ed150769e15d06fb435c6e360e28c9e7"
          if [[ "${{ github.sha }}" != "$expected" ]]; then
            echo "::error title=Stable integrity violation::stable must remain at $expected; observed ${{ github.sha }}"
            exit 1
          fi

  protected-baseline:
    if: github.ref != 'refs/heads/stable'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protected inventory
        run: pnpm test:inventory

      - name: Run Stage 0 contract tests
        run: >-
          pnpm exec vitest run
          src/__tests__/scripts/function-inventory.test.ts
          tests/unit/evidence-manifest.spec.ts
          tests/unit/protected-baseline-gate.spec.ts

      - name: Check protected baseline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            protected_base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            protected_base="${{ github.event.before }}"
            if [[ -z "$protected_base" || "$protected_base" =~ ^0+$ ]]; then
              protected_base="$(git merge-base HEAD origin/main)"
            fi
          else
            protected_base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$protected_base^{commit}"
          git show "$protected_base:docs/testing/baselines/stage-1-source-allowlist.json" > /tmp/trusted-stage-source-allowlist.json
          mapfile -t paths < <(jq -r '.paths[], .infrastructurePaths[]' /tmp/trusted-stage-source-allowlist.json)
          args=()
          for path in "${paths[@]}"; do
            args+=(--allow-path "$path")
          done
          pnpm check:protected-baseline -- --base "$protected_base" --candidate HEAD "${args[@]}"

      - name: Upload Stage 0 inventory contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-0-protected-baseline-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/testing/FUNCTION_INVENTORY.md
            docs/testing/PROTECTED_FEATURES.md
            docs/testing/baselines/
            docs/testing/evidence/README.md

      - name: Declare external verification limits
        run: |
          echo "This workflow does not claim that real providers, PostgreSQL concurrency,"
          echo "payment callbacks, cloud storage, or authenticated cloud E2E passed."

  stage-1-local-gates:
    if: github.ref != 'refs/heads/stable'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wujie_bridge_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wujie_bridge_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CPU media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify Stage 1 release contracts
        run: pnpm exec vitest run src/__tests__/scripts/stage-1-release-gate-contract.test.ts

      - name: Check reviewed Stage 1 source drift
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            protected_base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            protected_base="${{ github.event.before }}"
            if [[ -z "$protected_base" || "$protected_base" =~ ^0+$ ]]; then
              protected_base="$(git merge-base HEAD origin/main)"
            fi
          else
            protected_base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$protected_base^{commit}"
          git show "$protected_base:docs/testing/baselines/stage-1-source-allowlist.json" > /tmp/trusted-stage-source-allowlist.json
          mapfile -t paths < <(jq -r '.paths[], .infrastructurePaths[]' /tmp/trusted-stage-source-allowlist.json)
          args=()
          for path in "${paths[@]}"; do
            args+=(--allow-path "$path")
          done
          pnpm check:protected-baseline -- --base "$protected_base" --candidate HEAD "${args[@]}"

      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm ts-check

      - name: ESLint
        run: pnpm lint

      - name: Prepare isolated Vitest media root
        env:
          WUJIE_DATA_DIR: ${{ runner.temp }}/wujie-bridge-test-ci
        run: mkdir -p "$WUJIE_DATA_DIR"

      - name: Full automated test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          PGDATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/wujie_bridge_test_ci
          WUJIE_DATA_DIR: ${{ runner.temp }}/wujie-bridge-test-ci
        run: pnpm test:ci

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  stage-1-external-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - protected-baseline
      - stage-1-local-gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_BASE_URL: ${{ inputs.deployment_url }}
      E2E_DEPLOYMENT_COMMIT: ${{ inputs.deployment_commit }}
      E2E_STAGE1_GENERATION_MODEL: ${{ inputs.generation_model }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_ENABLE_PAID_GENERATION: "true"
      POSTGRES_TEST_DATABASE_URL: ${{ secrets.POSTGRES_TEST_DATABASE_URL }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify PostgreSQL concurrency and billing finality
        run: >-
          pnpm exec vitest run
          tests/integration/task-*-postgres.test.ts
          tests/integration/task-*-concurrency.test.ts

      - name: Capture Chromium Firefox and WebKit real evidence
        run: >-
          pnpm exec playwright test tests/e2e/stage-1-task-billing.spec.ts
          --project=chromium --project=firefox --project=webkit

      - name: Upload Stage 1 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-release-evidence-${{ inputs.deployment_commit }}
          if-no-files-found: error
          path: |
            playwright-report/
            test-results/
