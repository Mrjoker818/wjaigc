<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（金色） === */
      --color-primary:              #D4AF37;
      --color-primary-container:    #3D3420;
      --color-on-primary:           #0A0A0F;
      /* === 背景 / 表面（深色科技） === */
      --color-background:                 #0A0A0F;
      --color-surface-container-lowest:   #0E0E16;
      --color-surface:                    #12121A;
      --color-surface-container:          #181824;
      --color-surface-container-high:     #1E1E2C;
      --color-surface-container-highest:  #2A2A38;
      /* === 文字 === */
      --color-on-surface:           #E8E8ED;
      --color-on-surface-variant:   #8B8B9E;
      /* === 功能色 === */
      --color-success:  #34D399;
      --color-error:    #F87171;
      --color-warning:  #FBBF24;
      /* === 边框 === */
      --color-outline:          #2A2A38;
      --color-outline-variant:  #1E1E2A;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.625rem;
      --radius-lg:   0.875rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.3);
      --shadow-float:  0 4px 24px rgba(0,0,0,0.4);
      --shadow-dialog: 0 8px 40px rgba(0,0,0,0.6);
      --shadow-gold:   0 0 20px rgba(212,175,55,0.15);
      /* === 字体 === */
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", monospace;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%2312121A"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%238B8B9E" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen">

  <!-- @main-content:start -->
  <main class="min-h-screen flex items-center justify-center p-0">
    <div class="w-full min-h-screen flex flex-col lg:flex-row">

      <!-- 左侧品牌展示区 -->
      <div id="brand-panel" class="hidden lg:flex lg:w-1/2 relative overflow-hidden flex-col justify-between p-12 xl:p-16"
           style="background: linear-gradient(135deg, #0E0E16 0%, #151520 40%, #1A1A28 70%, #0E0E16 100%);">

        <!-- 渐变光效背景装饰 -->
        <div class="absolute top-0 left-0 w-full h-full pointer-events-none" aria-hidden="true">
          <div class="absolute -top-24 -left-24 w-80 h-80 rounded-full opacity-20"
               style="background: radial-gradient(circle, rgba(212,175,55,0.3) 0%, transparent 70%);"></div>
          <div class="absolute bottom-20 right-10 w-96 h-96 rounded-full opacity-10"
               style="background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, transparent 70%);"></div>
          <div class="absolute top-1/2 left-1/3 w-64 h-64 rounded-full opacity-10"
               style="background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 60%);"></div>
        </div>

        <!-- 品牌头部 -->
        <div class="relative z-10">
          <div class="flex items-center gap-3 mb-3">
            <i data-lucide="sparkles" class="w-8 h-8 text-primary"></i>
            <h1 class="text-3xl xl:text-4xl font-bold text-on-surface tracking-tight">无界AI</h1>
          </div>
          <p class="text-on-surface-variant text-base xl:text-lg">AI图像生成与协作平台</p>
        </div>

        <!-- 特性卡片 -->
        <div class="relative z-10 space-y-4 my-12">

          <!-- 特性卡片-无限画布 -->
          <div class="flex items-start gap-4 p-5 rounded-lg bg-surface-container/50 border border-outline/20 hover:border-primary/30 transition-colors group">
            <div class="w-10 h-10 rounded-md bg-primary-container flex items-center justify-center shrink-0 group-hover:shadow-gold transition-shadow">
              <i data-lucide="layout-dashboard" class="w-5 h-5 text-primary"></i>
            </div>
            <div>
              <h3 class="text-sm font-semibold text-on-surface mb-1">无限画布</h3>
              <p class="text-xs text-on-surface-variant leading-relaxed">自由缩放、无限延展的创作空间，支持多图层协同编辑</p>
            </div>
          </div>

          <!-- 特性卡片-AI智能修图 -->
          <div class="flex items-start gap-4 p-5 rounded-lg bg-surface-container/50 border border-outline/20 hover:border-primary/30 transition-colors group">
            <div class="w-10 h-10 rounded-md bg-primary-container flex items-center justify-center shrink-0 group-hover:shadow-gold transition-shadow">
              <i data-lucide="wand-2" class="w-5 h-5 text-primary"></i>
            </div>
            <div>
              <h3 class="text-sm font-semibold text-on-surface mb-1">AI智能修图</h3>
              <p class="text-xs text-on-surface-variant leading-relaxed">一键抠图、智能补全、风格迁移，让创作更高效</p>
            </div>
          </div>

          <!-- 特性卡片-工作流编排 -->
          <div class="flex items-start gap-4 p-5 rounded-lg bg-surface-container/50 border border-outline/20 hover:border-primary/30 transition-colors group">
            <div class="w-10 h-10 rounded-md bg-primary-container flex items-center justify-center shrink-0 group-hover:shadow-gold transition-shadow">
              <i data-lucide="git-branch" class="w-5 h-5 text-primary"></i>
            </div>
            <div>
              <h3 class="text-sm font-semibold text-on-surface mb-1">工作流编排</h3>
              <p class="text-xs text-on-surface-variant leading-relaxed">可视化节点编排，自定义AI处理流水线，自动化批量生成</p>
            </div>
          </div>

        </div>

        <!-- 版本号 -->
        <div class="relative z-10">
          <p class="text-xs text-on-surface-variant/50 font-mono">v2.9.0</p>
        </div>

      </div>

      <!-- 右侧登录表单区 -->
      <div id="login-panel" class="flex-1 flex items-center justify-center p-6 sm:p-8 lg:p-12"
           style="background-color: #0F1117;">

        <div class="w-full max-w-sm">

          <!-- 移动端品牌标识 -->
          <div class="lg:hidden flex items-center gap-2 mb-10 justify-center">
            <i data-lucide="sparkles" class="w-7 h-7 text-primary"></i>
            <span class="text-2xl font-bold text-on-surface tracking-tight">无界AI</span>
          </div>

          <!-- 登录标题 -->
          <h2 class="text-2xl font-bold text-on-surface mb-8">登录</h2>

          <!-- 登录表单 -->
          <form id="login-form" autocomplete="off">

            <!-- 用户名输入框 -->
            <div class="mb-5">
              <label for="input-username" class="block text-xs font-medium text-on-surface-variant mb-1.5">用户名</label>
              <div class="relative">
                <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">
                  <i data-lucide="user" class="w-4 h-4 text-on-surface-variant/60"></i>
                </div>
                <input id="input-username" type="text" placeholder="请输入用户名"
                       class="w-full bg-surface-container border-none rounded-md pl-10 pr-3 py-2.5 text-sm
                              text-on-surface placeholder:text-on-surface-variant/40
                              focus:outline-none focus:ring-2 focus:ring-primary/40 transition-colors" />
              </div>
            </div>

            <!-- 密码输入框 -->
            <div class="mb-6">
              <label for="input-password" class="block text-xs font-medium text-on-surface-variant mb-1.5">密码</label>
              <div class="relative">
                <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">
                  <i data-lucide="lock" class="w-4 h-4 text-on-surface-variant/60"></i>
                </div>
                <input id="input-password" type="password" placeholder="请输入密码"
                       class="w-full bg-surface-container border-none rounded-md pl-10 pr-10 py-2.5 text-sm
                              text-on-surface placeholder:text-on-surface-variant/40
                              focus:outline-none focus:ring-2 focus:ring-primary/40 transition-colors" />
                <button type="button" id="btn-toggle-password"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-on-surface-variant transition-colors"
                        aria-label="切换密码可见性">
                  <i data-lucide="eye-off" class="w-4 h-4" id="icon-eye-off"></i>
                  <i data-lucide="eye" class="w-4 h-4 hidden" id="icon-eye"></i>
                </button>
              </div>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" id="btn-login"
                    class="w-full bg-primary text-on-primary font-semibold py-2.5 rounded-md text-sm
                           hover:brightness-110 active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
              <span id="btn-login-text">登录</span>
              <!-- 加载态 spinner -->
              <svg id="btn-login-spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.3"></circle>
                <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
              </svg>
            </button>

          </form>

          <!-- 错误提示区域 -->
          <div id="login-error" class="hidden mt-4 px-4 py-3 rounded-md text-sm font-medium"
               style="background-color: #3D1518;">
            <span id="login-error-text" class="text-error"></span>
          </div>

        </div>

      </div>

    </div>
  </main>
  <!-- @main-content:end -->

  <script>
    $(function () {

      // 密码可见/不可见切换
      $('#btn-toggle-password').on('click', function () {
        var $pw = $('#input-password');
        var isPassword = $pw.attr('type') === 'password';
        $pw.attr('type', isPassword ? 'text' : 'password');
        $('#icon-eye-off').toggleClass('hidden', isPassword);
        $('#icon-eye').toggleClass('hidden', !isPassword);
      });

      // 表单提交 — demo 项目不判断账密，直接跳转
      $('#login-form').on('submit', function (e) {
        e.preventDefault();

        var $btn = $('#btn-login');
        var $text = $('#btn-login-text');
        var $spinner = $('#btn-login-spinner');
        var $error = $('#login-error');

        // 隐藏之前的错误提示
        $error.addClass('hidden');

        // 显示加载态
        $btn.prop('disabled', true);
        $text.text('登录中...');
        $spinner.removeClass('hidden');

        // 模拟短暂加载后跳转到画布页面
        setTimeout(function () {
          window.location.href = 'canvas.html';
        }, 800);
      });

    });
  </script>

  <script>lucide.createIcons();</script>
</body>
</html>
