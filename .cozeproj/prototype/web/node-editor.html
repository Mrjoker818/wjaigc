    @theme {

      --color-primary:              #d4af37;

      /* === 背景 / 表面 === */

      --color-surface:                    #1c2128;
      --color-surface-container:          #161b22;

      /* === 功能色 === */
      --color-success:  #3fb950;
      --color-error:    #f85149;
      --color-warning:  #d29922;
      /* === 端口颜色 === */
      --color-port-prompt:     #3fb950;
      --color-port-image:      #58a6ff;

      /* === 圆角 === */
      --radius-sm:   0.25rem;

      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;

      --shadow-float:  0 8px 32px rgba(0,0,0,0.5);

      --shadow-node-selected: 0 0 0 2px #d4af37, 0 4px 16px rgba(0,0,0,0.5);

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

  <style>
    /* 点阵网格背景 */
    #canvas-viewport {
      background-color: #161b22;
      background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* 节点卡片 */
    .node-card {
      position: absolute;
      width: 220px;
      background: #1c2128;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
      border: 1.5px solid transparent;
    }
    .node-card:active {
      cursor: grabbing;
    }
    .node-card.selected {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px #d4af37, 0 4px 16px rgba(0,0,0,0.5);
    }

    /* 节点标题栏 */
    .node-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 6px 6px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: #e6edf3;
    }

    /* 端口行 */
    .port-row {
      display: flex;
      align-items: center;
      padding: 3px 12px;
      font-size: 11px;
      color: #7d8590;
    }
    .port-row.input-row {
      justify-content: flex-start;
    }
    .port-row.output-row {
      justify-content: flex-end;
    }

    /* 端口圆点 */
    .port-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid;
      background: #1c2128;
      flex-shrink: 0;
      transition: transform 0.15s ease, background-color 0.15s ease;
      cursor: crosshair;
      position: relative;
      z-index: 5;
    }
    .port-dot:hover {
      transform: scale(1.5);
      background-color: currentColor;
    }
    .port-dot.input-port {
      margin-left: -18px;
      margin-right: 6px;
    }
    .port-dot.output-port {
      margin-right: -18px;
      margin-left: 6px;
    }

    /* 节点内容区 */
    .node-content {
      padding: 6px 12px 10px;
    }

    /* 模型选择下拉 */
    .node-select {
      width: 100%;
      background: #262c36;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: #e6edf3;
      outline: none;
      cursor: pointer;
    }
    .node-select:focus {
      box-shadow: 0 0 0 1.5px rgba(212,175,55,0.4);
    }

    /* 连线交互 */
    .connection-path {
      cursor: pointer;
      transition: stroke 0.15s ease;
    }

      stroke: #6e7681;
    }
    .connection-path.selected {
      stroke: #d4af37;
    }
