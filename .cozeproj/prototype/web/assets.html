  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #D4AF37;
      --color-primary-container:    #2A2410;
      --color-on-primary:           #0A0A0F;
      /* === 背景 / 表面 === */
      --color-background:                 #0A0A0F;
      --color-surface-container-lowest:   #0E0E13;
      --color-surface:                    #141418;
      --color-surface-container:          #1C1C22;
      --color-surface-container-high:     #242430;
      --color-surface-container-highest:  #2C2C3A;
      /* === 文字 === */
      --color-on-surface:           #F0F0F5;
      --color-on-surface-variant:   #8B8B9E;
      /* === 功能色 === */
      --color-success:  #16A37B;
      --color-error:    #E5484D;
      --color-warning:  #F59E0B;
      /* === 边框 === */
      --color-outline:          rgba(255,255,255,0.15);
      --color-outline-variant:  rgba(255,255,255,0.06);
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.4);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.5);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.6);
      /* === 字体 === */
      --font-sans: system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23141418"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%238B8B9E" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>
