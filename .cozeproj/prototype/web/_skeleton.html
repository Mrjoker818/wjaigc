<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #D4AF37;
      --color-primary-container:    #2A2410;
      --color-on-primary:           #0A0A0F;
      /* === 背景 / 表面 === */
      --color-background:                 #0A0A0F;
      --color-surface-container-lowest:   #0E0E13;
      --color-surface:                    #141418;
      --color-surface-container:          #1C1C22;
      --color-surface-container-high:     #242430;
      --color-surface-container-highest:  #2C2C3A;
      /* === 文字 === */
      --color-on-surface:           #F0F0F5;
      --color-on-surface-variant:   #8B8B9E;
      /* === 功能色 === */
      --color-success:  #16A37B;
      --color-error:    #E5484D;
      --color-warning:  #F59E0B;
      /* === 边框 === */
      --color-outline:          rgba(255,255,255,0.15);
      --color-outline-variant:  rgba(255,255,255,0.06);
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.4);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.5);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.6);
      /* === 字体 === */
      --font-sans: system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23141418"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%238B8B9E" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <header class="bg-surface sticky top-0 z-40 h-14 flex items-center justify-between px-5 border-b border-outline-variant/20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-primary/20 flex items-center justify-center">
        <i data-lucide="infinity" class="w-5 h-5 text-primary"></i>
      </div>
      <span class="font-bold text-base text-on-surface tracking-wide">无界AI</span>
    </div>
    <div class="flex items-center gap-2">
      <button class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors cursor-pointer" aria-label="通知">
        <i data-lucide="bell" class="w-4 h-4 text-on-surface-variant"></i>
      </button>
      <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center cursor-pointer">
        <span class="text-xs font-semibold text-primary">初</span>
      </div>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 3.5rem)">
    <aside class="w-56 shrink-0 bg-surface border-r border-outline-variant/20 overflow-y-auto">
      <div class="p-3 space-y-0.5">
        <a href="projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-primary/10 text-primary font-medium text-sm cursor-pointer" aria-current="page">
          <i data-lucide="folder-open" class="w-4 h-4"></i>我的项目
        </a>
        <a href="templates.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors cursor-pointer">
          <i data-lucide="layout-template" class="w-4 h-4"></i>模板广场
        </a>
        <a href="assets.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors cursor-pointer">
          <i data-lucide="archive" class="w-4 h-4"></i>资产库
        </a>
      </div>
      <div class="border-t border-outline-variant/20 mx-3 my-2"></div>
      <div class="px-3 pb-3">
        <div class="px-3 py-2 text-xs text-on-surface-variant uppercase tracking-wider">快速创建</div>
        <button class="w-full mt-1 flex items-center gap-3 px-3 py-2.5 rounded-md bg-primary text-on-primary font-medium text-sm hover:opacity-90 transition-opacity cursor-pointer">
          <i data-lucide="plus" class="w-4 h-4"></i>新建项目
        </button>
      </div>
      <div class="border-t border-outline-variant/20 mx-3 my-2"></div>
      <div class="px-3 pb-3">
        <div class="px-3 py-2 text-xs text-on-surface-variant uppercase tracking-wider">存储用量</div>
        <div class="px-3 py-2">
          <div class="flex items-center justify-between text-xs text-on-surface-variant mb-1.5">
            <span>已用 2.4 GB</span>
            <span>/ 10 GB</span>
          </div>
          <div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
            <div class="h-full bg-primary rounded-full" style="width: 24%"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto bg-background p-6">
      <!-- 页面内容由子 Agent 填充 -->
    </main>
    <!-- @main-content:end -->
  </div>
  <!-- @nav:end 导航组件 -->

  <script>lucide.createIcons();</script>
</body>

</html>
