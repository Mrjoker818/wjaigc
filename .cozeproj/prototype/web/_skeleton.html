<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（金色） === */
      --color-primary:              #D4AF37;
      --color-primary-container:    #3D3420;
      --color-on-primary:           #0A0A0F;
      /* === 背景 / 表面（深色科技） === */
      --color-background:                 #0A0A0F;
      --color-surface-container-lowest:   #0E0E16;
      --color-surface:                    #12121A;
      --color-surface-container:          #181824;
      --color-surface-container-high:     #1E1E2C;
      --color-surface-container-highest:  #2A2A38;
      /* === 文字 === */
      --color-on-surface:           #E8E8ED;
      --color-on-surface-variant:   #8B8B9E;
      /* === 功能色 === */
      --color-success:  #34D399;
      --color-error:    #F87171;
      --color-warning:  #FBBF24;
      /* === 边框 === */
      --color-outline:          #2A2A38;
      --color-outline-variant:  #1E1E2A;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.625rem;
      --radius-lg:   0.875rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.3);
      --shadow-float:  0 4px 24px rgba(0,0,0,0.4);
      --shadow-dialog: 0 8px 40px rgba(0,0,0,0.6);
      --shadow-gold:   0 0 20px rgba(212,175,55,0.15);
      /* === 字体 === */
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", monospace;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%2312121A"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%238B8B9E" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件，画布模式不需要传统导航 -->
  <!-- @nav:end 导航组件 -->

  <main class="flex-1 min-h-screen">
    <!-- @main-content:start -->
    <!-- @main-content:end -->
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
