<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #d4af37;
      --color-primary-container:    #2a2410;
      --color-on-primary:           #0a0a0b;
      /* === 背景 / 表面 === */
      --color-background:                 #0a0a0b;
      --color-surface-container-lowest:   #111113;
      --color-surface:                    #1a1a1e;
      --color-surface-container:          #252529;
      --color-surface-container-high:     #2e2e33;
      --color-surface-container-highest:  #38383e;
      /* === 文字 === */
      --color-on-surface:           #f5f5f5;
      --color-on-surface-variant:   #a1a1aa;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      --color-info:     #3b82f6;
      /* === 边框 === */
      --color-outline:          #2e2e33;
      --color-outline-variant:  #1f1f24;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.3);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.5);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.6);
      --shadow-glow:   0 0 20px rgba(212,175,55,0.15);
      /* === 字体 === */
      --font-sans: system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
    }
  </style>

  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%231a1a1e"/><text x="50%" y="50%" text-anchor="middle" font-size="14" fill="%23a1a1aa" font-family="system-ui" dominant-baseline="central">Image</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>
